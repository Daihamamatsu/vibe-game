<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>RPG Game</title>
    <style>
        body { margin: 0; overflow: hidden; }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.5);
            color: white;
            padding: 10px;
            border-radius: 5px;
            font-family: Arial, sans-serif;
        }
        #hp-bar {
            width: 200px;
            height: 20px;
            background: #333;
            border: 2px solid #fff;
            border-radius: 10px;
            margin-top: 10px;
        }
        #hp-fill {
            width: 100%;
            height: 100%;
            background: #f00;
            border-radius: 10px;
        }
        #game-over {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        #game-over .title {
            font-size: 48px;
            margin-top: 40%;
        }
        #game-over .hint {
            font-size: 18px;
            margin-top: 16px;
        }
    </style>
</head>
<body>
    <div id="ui">
        <div>HP: <span id="hp">100</span>%</div>
        <div id="hp-bar">
            <div id="hp-fill"></div>
        </div>
    </div>
    <div id="game-over">
        <div class="title">GAME OVER</div>
        <div class="hint">Rキーでリスタート</div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
    <script src="game.js"></script>
</body>
</html>
